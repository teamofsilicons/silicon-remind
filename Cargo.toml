[workspace]
members = ["crates/client", "crates/cli"]
default-members = ["."]
resolver = "3"

[package]
name = "silicon-remind"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "Proprietary"
publish = false
default-run = "remind-api"

[lib]
name = "silicon_remind"
path = "src/lib.rs"

[[bin]]
name = "remind-api"
path = "src/bin/remind_api.rs"

[[bin]]
name = "remind-worker"
path = "src/bin/remind_worker.rs"

[[bin]]
name = "remind-migrate"
path = "src/bin/remind_migrate.rs"

[dependencies]
aes-gcm = "0.10.3"
anyhow = "1.0.100"
async-trait = "0.1.89"
axum = { version = "0.8.9", features = ["http2", "json", "macros", "matched-path"] }
base64 = "0.22.1"
bytes = "1.11.0"
chrono = { version = "0.4.42", features = ["serde"] }
chrono-tz = { version = "0.10.4", features = ["serde"] }
clap = { version = "4.5.48", features = ["derive", "env"] }
cronexpr = "=1.5.0"
dotenvy = "0.15.7"
hex = "0.4.3"
hmac = "0.12.1"
http = "1.3.1"
http-body-util = "0.1.3"
prometheus-client = "0.25.0"
rand = "0.9.2"
reqwest = { version = "0.13.4", default-features = false, features = ["form", "http2", "json", "rustls"] }
secrecy = { version = "0.10.3", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
silicon-iam-client = "1.4.0"
sqlx = { version = "0.9.0", default-features = false, features = ["chrono", "json", "macros", "migrate", "postgres", "runtime-tokio", "tls-rustls-ring-native-roots", "uuid"] }
subtle = "2.6.1"
thiserror = "2.0.17"
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower = { version = "0.5.2", features = ["buffer", "limit", "load-shed", "timeout", "util"] }
tower-http = { version = "0.7.0", features = ["catch-panic", "cors", "limit", "request-id", "sensitive-headers", "set-header", "timeout", "trace"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "json"] }
url = { version = "2.5.7", features = ["serde"] }
uuid = { version = "1.26.0", features = ["serde", "v4", "v7"] }
zeroize = { version = "1.8.2", features = ["derive"] }

[dev-dependencies]
pretty_assertions = "1.4.1"
proptest = "1.8.0"
serde_yml = "0.0.12"
testcontainers = "0.27.3"
testcontainers-modules = { version = "0.15.0", features = ["postgres"] }
wiremock = "0.6.5"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "deny"
expect_used = "deny"
pedantic = { level = "warn", priority = -1 }
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
