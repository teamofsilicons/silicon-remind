name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bootstrap:
    name: Restricted bootstrap grants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 deploy/aws/test_bootstrap_grants.py

  rust:
    name: Rust quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      # The database tests create and drop one remind_t_<uuid> database each on this server
      # (src/test_support.rs); without REMIND_TEST_POSTGRES_URL they would start a container per test.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      REMIND_TEST_POSTGRES_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt,clippy

      - name: Cache Cargo artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-1.98.0-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-1.98.0-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check all targets
        run: cargo check --locked --workspace --all-targets --all-features

      - name: Run Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --locked --workspace --all-targets --all-features

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install account UUID migration dependencies
        run: python -m pip install -r scripts/accounts_uuid128.requirements.txt
      - name: Verify production and retained-test UUID backfills
        run: python scripts/test_accounts_uuid128.py

      - name: Run documentation tests
        run: cargo test --locked -p silicon-remind-client --doc

  openapi:
    name: OpenAPI contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validator
        run: python -m pip install --disable-pip-version-check openapi-spec-validator==0.7.2

      - name: Validate OpenAPI
        run: python -m openapi_spec_validator openapi.yaml

  web:
    name: Website
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - run: pnpm --dir frontend install --frozen-lockfile
      - run: pnpm --dir frontend typecheck
      - run: pnpm --dir frontend lint
      - run: pnpm --dir frontend test
      - run: pnpm --dir frontend build

  docs:
    name: Documentation and packaging scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Rust for the public source bundle
        run: rustup toolchain install 1.98.0 --profile minimal
      - run: cargo fetch --locked
      - name: Check the manuals bundled in the client and CLI
        run: python3 scripts/sync-package-docs.py --check
      - name: Check the packaging and development scripts
        run: |
          python3 -m py_compile scripts/*.py deploy/aws/*.py
          for script in scripts/package-apps.sh scripts/dev-accounts.sh scripts/dev-accounts-stop.sh scripts/e2e-accounts.sh deploy/aws/deploy-standalone.sh deploy/aws/install-web.sh docs/install.sh; do bash -n "$script"; done
          scripts/package-apps.sh --help > /dev/null
          python3 -I scripts/dev_accounts.py --help > /dev/null
          python3 -I scripts/e2e_accounts.py --help > /dev/null
      - run: npm ci --prefix docs-site
      - run: npm run build --prefix docs-site
      - run: npm run check --prefix docs-site
