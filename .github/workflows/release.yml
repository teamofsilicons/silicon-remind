name: Build validated Honeycomb release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux-x86_64
            triple: x86_64-unknown-linux-gnu
            binary: remind
          - runner: ubuntu-24.04-arm
            target: linux-aarch64
            triple: aarch64-unknown-linux-gnu
            binary: remind
          - runner: windows-2025
            target: windows-x86_64
            triple: x86_64-pc-windows-msvc
            binary: remind.exe
          - runner: windows-11-arm
            target: windows-aarch64
            triple: aarch64-pc-windows-msvc
            binary: remind.exe
          - runner: macos-15-intel
            target: macos-x86_64
            triple: x86_64-apple-darwin
            binary: remind
          - runner: macos-15
            target: macos-aarch64
            triple: aarch64-apple-darwin
            binary: remind
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
          targets: ${{ matrix.triple }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
      - run: python scripts/sync-package-docs.py && git diff --exit-code -- crates/cli/docs crates/client/docs
      - run: cargo test --locked -p silicon-remind-cli --target ${{ matrix.triple }}
      - uses: actions/setup-python@v5
        if: runner.os == 'Linux'
        with:
          python-version: "3.12"
      - name: Install the Linux baseline toolchain
        if: runner.os == 'Linux'
        run: |
          python3 -m pip install 'cargo-zigbuild==0.23.4' 'ziglang==0.15.2'
          python3 -c 'from pathlib import Path; import ziglang; print("CARGO_ZIGBUILD_ZIG_PATH=" + str(Path(ziglang.__file__).with_name("zig")))' >> "$GITHUB_ENV"
      - name: Build Linux CLI for the existing glibc 2.28 baseline
        if: runner.os == 'Linux'
        run: cargo zigbuild --release --locked -p silicon-remind-cli --target ${{ matrix.triple }}.2.28
      - name: Build native CLI
        if: runner.os != 'Linux'
        run: cargo build --release --locked -p silicon-remind-cli --target ${{ matrix.triple }}
      - run: ./target/${{ matrix.triple }}/release/${{ matrix.binary }} --version
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: target/${{ matrix.triple }}/release/${{ matrix.binary }}
          if-no-files-found: error

  package:
    needs: binaries
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-binaries
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
      - name: Install the pinned Honeycomb packager
        run: cargo install --locked --git https://github.com/teamofsilicons/silicon-honeycomb --rev 40f54d08b2cd9171c375e6f812764a140b6408f3 silicon-honeycomb-cli
      - name: Check release tag against the CLI version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os, tomllib
          with open('crates/cli/Cargo.toml', 'rb') as source:
              version = tomllib.load(source)['package']['version']
          assert os.environ['RELEASE_TAG'] == f'v{version}', 'Release tag must match the CLI version'
          PY
      - run: python scripts/package-release.py --binaries-dir release-binaries
      - uses: actions/upload-artifact@v4
        with:
          name: remind-honeycomb-release
          path: dist/*
          if-no-files-found: error

# This workflow produces reviewable artifacts; it does not publish a release.
