[package]
name = "silicon-remind-client"
version = "0.1.1"
edition = "2024"
rust-version = "1.98"
description = "Stateless Rust client for Silicon Remind reminders and test environments"
license = "Apache-2.0"
readme = "README.md"
include = ["src/**", "docs/**", "README.md", "LICENSE", "Cargo.toml", "Cargo.lock", "openapi.yaml"]
repository = "https://github.com/teamofsilicons/silicon-remind"

[dependencies]
chrono = { version = "0.4.42", features = ["serde"] }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "query", "rustls"] }
secrecy = { version = "0.10.3", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
semver = "1.0.27"
thiserror = "2.0.17"
tokio = { version = "1.53.1", features = ["rt", "time", "sync"] }
url = "2.5.7"
uuid = { version = "1.26.0", features = ["serde", "v7"] }
